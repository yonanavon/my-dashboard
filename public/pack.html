<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דשבורד אריזה - גלגל המזל</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { background: #0d1117; }

    .pack-layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px;
      min-height: calc(100vh - 64px);
    }

    @media (max-width: 700px) {
      .pack-layout { grid-template-columns: 1fr; }
    }

    /* Current item */
    .current-card {
      background: linear-gradient(135deg, rgba(46,204,113,0.12), rgba(46,204,113,0.04));
      border: 2px solid var(--green);
      border-radius: 24px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 300px;
      position: relative;
    }
    .current-card.empty {
      border-color: var(--card-border);
      background: var(--card-bg);
    }
    .current-label {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }
    .current-student {
      font-size: 2.6rem;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 6px;
      line-height: 1.1;
    }
    .current-class {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .current-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
      width: 100%;
      max-width: 420px;
    }
    .current-item-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(46,204,113,0.12);
      border: 1px solid rgba(46,204,113,0.35);
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--green);
    }
    .current-item-row .bullet {
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      flex-shrink: 0;
    }
    .pack-hint {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      border-radius: 50px;
      padding: 10px 24px;
      font-size: 1rem;
      color: var(--text-muted);
    }
    .pack-hint kbd {
      background: rgba(255,255,255,0.15);
      border-radius: 6px;
      padding: 2px 10px;
      font-family: monospace;
      font-size: 1.1rem;
      color: var(--accent);
      font-weight: 700;
    }
    .pack-btn {
      font-size: 1.2rem;
      padding: 14px 40px;
      margin-top: 16px;
    }

    /* Sidebar */
    .sidebar { display: flex; flex-direction: column; gap: 16px; }

    .queue-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); overflow: hidden; }
    .queue-card-header {
      padding: 14px 20px;
      background: rgba(255,255,255,0.05);
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .queue-count { background: var(--accent); color: #1a0a2e; border-radius: 50px; padding: 2px 10px; font-size: 0.8rem; font-weight: 800; }

    .queue-list { max-height: 260px; overflow-y: auto; }
    .queue-item {
      padding: 12px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 0.9rem;
    }
    .queue-item:last-child { border-bottom: none; }
    .queue-item .item-n {
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .queue-item .item-s { color: var(--text-muted); font-size: 0.82rem; margin-top: 2px; }
    .queue-item .qty-badge {
      background: var(--accent);
      color: #1a0a2e;
      border-radius: 50px;
      padding: 1px 8px;
      font-size: 0.75rem;
      font-weight: 800;
      min-width: 22px;
      text-align: center;
    }

    .done-list { max-height: 240px; overflow-y: auto; }
    .done-item {
      padding: 10px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .done-item:last-child { border-bottom: none; }
    .done-item .check { color: var(--green); font-size: 1rem; }

    .empty-queue { padding: 24px; text-align: center; color: var(--text-muted); font-size: 0.9rem; }

    /* Flash animation when new item arrives */
    @keyframes flashGreen {
      0% { box-shadow: 0 0 0 0 rgba(46,204,113,0.6); }
      50% { box-shadow: 0 0 0 20px rgba(46,204,113,0); }
      100% { box-shadow: 0 0 0 0 rgba(46,204,113,0); }
    }
    .flash { animation: flashGreen 0.8s ease; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">🎡 גלגל המזל</a>
    <div class="navbar-links">
      <a href="/">גלגל</a>
      <a href="/pack" class="active">אריזה</a>
      <a href="/admin">ניהול</a>
    </div>
  </nav>

  <div class="pack-layout">
    <!-- Main: Current Item -->
    <div>
      <div class="current-card empty" id="current-card">
        <div class="current-label">לאריזה עכשיו</div>
        <div id="current-empty" style="color:var(--text-muted);font-size:1.1rem;">
          <div style="font-size:3rem;margin-bottom:12px;">📦</div>
          ממתינים לזכיות...
        </div>
        <div id="current-content" style="display:none;width:100%;align-items:center;flex-direction:column;">
          <div class="current-student" id="cur-student"></div>
          <div class="current-class" id="cur-class"></div>
          <div class="current-items" id="cur-items"></div>
          <div class="pack-hint">לחץ <kbd>SPACE</kbd> לסיום (<span id="cur-count">0</span> פריטים)</div>
          <button class="btn btn-success pack-btn" onclick="packCurrent()">✓ בוצע</button>
        </div>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <!-- Queue -->
      <div class="queue-card">
        <div class="queue-card-header">
          בתור
          <span class="queue-count" id="queue-count">0</span>
        </div>
        <div class="queue-list" id="queue-list">
          <div class="empty-queue">התור ריק</div>
        </div>
      </div>

      <!-- Done -->
      <div class="queue-card">
        <div class="queue-card-header">
          בוצע
          <span class="queue-count" id="done-count" style="background:var(--green)">0</span>
        </div>
        <div class="done-list" id="done-list">
          <div class="empty-queue">אין עדיין</div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ===== State =====
    let pending = [];      // unpacked wins NOT in current group (flat list)
    let current = null;    // { key, student_id, student_name, class, wins: [...] }
    let done = [];
    let lastFlashKey = null;

    // ===== Helpers =====
    function groupKey(w) {
      // Anonymous wins (no student_id) don't group together
      return w.student_id ? 'sid:' + w.student_id : 'win:' + w.id;
    }

    function buildGroups(wins) {
      const map = new Map();
      for (const w of wins) {
        const k = groupKey(w);
        let g = map.get(k);
        if (!g) {
          g = {
            key: k,
            student_id: w.student_id || null,
            student_name: w.student_name,
            class: w.class,
            wins: [],
          };
          map.set(k, g);
        }
        g.wins.push(w);
      }
      const groups = [...map.values()];
      for (const g of groups) {
        g.wins.sort((a, b) => a.id - b.id);
        g.earliestId = g.wins[0].id;
      }
      // Sort: by item count DESC, then by earliest id ASC (FIFO within ties)
      groups.sort((a, b) => {
        if (b.wins.length !== a.wins.length) return b.wins.length - a.wins.length;
        return a.earliestId - b.earliestId;
      });
      return groups;
    }

    // ===== Socket =====
    const socket = io();

    socket.on('new_win', ({ win }) => {
      if (current && groupKey(win) === current.key) {
        current.wins.push(win);
        current.wins.sort((a, b) => a.id - b.id);
      } else {
        pending.push(win);
        if (!current) advanceQueue();
      }
      renderAll();
    });

    socket.on('item_packed', ({ win_id }) => {
      if (current) {
        const idx = current.wins.findIndex(w => w.id === win_id);
        if (idx !== -1) {
          const removed = current.wins.splice(idx, 1)[0];
          removed.packed = 1;
          done.unshift(removed);
          if (current.wins.length === 0) {
            current = null;
            advanceQueue();
          }
          renderAll();
          return;
        }
      }
      const idx = pending.findIndex(w => w.id === win_id);
      if (idx !== -1) {
        const removed = pending.splice(idx, 1)[0];
        removed.packed = 1;
        done.unshift(removed);
      }
      renderAll();
    });

    // ===== Load existing wins =====
    async function loadWins() {
      const r = await fetch('/api/wins');
      const wins = await r.json();
      pending = wins.filter(w => !w.packed).reverse(); // oldest first
      done = wins.filter(w => w.packed); // newest first (API returns DESC)
      current = null;
      advanceQueue();
      renderAll();
    }

    // ===== Queue management =====
    function advanceQueue() {
      if (current) return;
      if (pending.length === 0) {
        current = null;
        return;
      }
      const groups = buildGroups(pending);
      const top = groups[0];
      const ids = new Set(top.wins.map(w => w.id));
      pending = pending.filter(w => !ids.has(w.id));
      current = top;
    }

    async function packCurrent() {
      if (!current || current.wins.length === 0) return;
      const ids = current.wins.map(w => w.id);
      const r = await fetch('/api/wins/pack-bulk', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids })
      });
      if (!r.ok) {
        toast('שגיאה בעת אריזה', 'error');
        return;
      }
      // Socket events handle the UI update
    }

    // ===== Render =====
    function renderAll() {
      renderCurrent();
      renderQueue();
      renderDone();
    }

    function renderCurrent() {
      const card = document.getElementById('current-card');
      const empty = document.getElementById('current-empty');
      const content = document.getElementById('current-content');

      if (!current || current.wins.length === 0) {
        card.classList.add('empty');
        empty.style.display = 'block';
        content.style.display = 'none';
        lastFlashKey = null;
        return;
      }

      card.classList.remove('empty');
      empty.style.display = 'none';
      content.style.display = 'flex';
      document.getElementById('cur-student').textContent = '👤 ' + current.student_name;
      document.getElementById('cur-class').textContent = current.class ? 'כיתה ' + current.class : '';
      document.getElementById('cur-count').textContent = current.wins.length;
      document.getElementById('cur-items').innerHTML = current.wins.map(w => `
        <div class="current-item-row">
          <span class="bullet"></span>
          <span>${esc(w.item_name)}</span>
        </div>
      `).join('');

      // Flash when current group changes or items added
      const flashKey = current.key + ':' + current.wins.length;
      if (flashKey !== lastFlashKey) {
        card.classList.remove('flash');
        void card.offsetWidth;
        card.classList.add('flash');
        lastFlashKey = flashKey;
      }
    }

    function renderQueue() {
      const list = document.getElementById('queue-list');
      const groups = buildGroups(pending);
      const totalItems = pending.length;
      document.getElementById('queue-count').textContent = totalItems;

      if (!groups.length) {
        list.innerHTML = '<div class="empty-queue">התור ריק</div>';
        return;
      }
      list.innerHTML = groups.map(g => {
        const itemsText = g.wins.map(w => esc(w.item_name)).join(', ');
        const classText = g.class ? ' · כיתה ' + esc(g.class) : '';
        const badge = g.wins.length > 1 ? `<span class="qty-badge">${g.wins.length}</span>` : '';
        return `
          <div class="queue-item">
            <div class="item-n">${badge}<span>${esc(g.student_name)}</span></div>
            <div class="item-s">${itemsText}${classText}</div>
          </div>
        `;
      }).join('');
    }

    function renderDone() {
      const list = document.getElementById('done-list');
      document.getElementById('done-count').textContent = done.length;

      if (!done.length) {
        list.innerHTML = '<div class="empty-queue">אין עדיין</div>';
        return;
      }
      list.innerHTML = done.slice(0, 20).map(w => `
        <div class="done-item">
          <span class="check">✓</span>
          <span>${esc(w.item_name)} — ${esc(w.student_name)}</span>
        </div>
      `).join('');
    }

    // ===== Keyboard =====
    document.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault();
        packCurrent();
      }
    });

    function esc(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function toast(msg, type = '') {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      t.className = 'toast ' + type;
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    loadWins();
  </script>
</body>
</html>
